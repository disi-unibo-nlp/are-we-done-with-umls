[project]
name = "are-we-done-with-umls"
version = "0.1.0"
description = "Stage-level diagnostics for UMLS evidence construction in medical QA."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel>=6.29",
  "jupyter>=1.0",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
linkers = [
  "scispacy>=0.5.5",
  "spacy>=3.7",
]
models = [
  "accelerate>=0.34",
  "huggingface-hub>=0.23",
  "sentence-transformers>=3.0",
  "transformers>=4.40",
]

[tool.uv]
package = false
